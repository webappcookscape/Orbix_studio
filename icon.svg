<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- 3D Cupboard CAD Precision Wireframe Geometry -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Isometric Hexagon -->
    <!-- Center: 0, 0; r = 164 -->
    <!-- Top: 0, -164 -->
    <!-- Top-Right: 142, -82 -->
    <!-- Bottom-Right: 142, 82 -->
    <!-- Bottom: 0, 164 -->
    <!-- Bottom-Left: -142, 82 -->
    <!-- Top-Left: -142, -82 -->

    <!-- Ambient Face Shading -->
    <polygon points="0,0 142,-82 0,-164 -142,-82" fill="#FFFFFF" fill-opacity="0.12"/>
    <polygon points="0,0 -142,82 -142,-82" fill="#000000" fill-opacity="0.10"/>
    <polygon points="0,0 142,82 142,-82" fill="#FFFFFF" fill-opacity="0.04"/>

    <!-- Perimeter Outline -->
    <polygon points="0,-164 142,-82 142,82 0,164 -142,82 -142,-82"
             fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Internal Y Spokes (3D Box Interior Edges) -->
    <line x1="0" y1="0" x2="0" y2="-164" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-142" y2="82" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="142" y2="82" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Internal Shelves & Dividers -->
    <line x1="-71" y1="41" x2="0" y2="82" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="-71" y1="-41" x2="0" y2="-82" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="71" y1="41" x2="0" y2="82" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
