<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookscape — Head Commercial Review &amp; Approval</title>
  <style>
    :root {
      --bg: #F4EDE3;
      --card: #FFFFFF;
      --forest: #08231B;
      --crimson: #C00000;
      --muted: #64748B;
      --border: #DDD2C3;
      --gold-bg: #FEF9C3;
      --ok-bg: #DCFCE7;
      --ok-fg: #166534;
      --warn-bg: #FEF3C7;
      --warn-fg: #92400E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--forest);
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--forest);
      color: #fff;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-tag {
      background: var(--crimson);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
    }
    .brand-title { font-size: 15px; font-weight: 700; }
    .brand-sub { font-size: 11.5px; color: #CBD5E1; margin-top: 1px; }
    .status-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .status-pill.is-pending { background: var(--warn-bg); color: var(--warn-fg); }
    .status-pill.is-approved { background: var(--ok-bg); color: var(--ok-fg); }

    .container {
      max-width: 1280px;
      margin: 22px auto 60px auto;
      padding: 0 16px;
    }
    .review-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }
    .review-sidebar {
      position: sticky;
      top: 76px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(8, 35, 27, 0.07);
    }
    .review-sidebar-head {
      background: linear-gradient(90deg, #08231B 0%, #113B2F 100%);
      color: #fff;
      padding: 13px 16px;
    }
    .review-sidebar-head h3 {
      margin: 0;
      font-size: 14.5px;
      letter-spacing: 0.02em;
    }
    .review-sidebar-head p {
      margin: 3px 0 0 0;
      font-size: 11px;
      color: #CBD5E1;
    }
    .review-sidebar-list {
      padding: 10px 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ref-var-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid #E5DDD2;
      border-radius: 9px;
      background: #FAF6F0;
    }
    .ref-var-item.is-selected {
      background: #FEF2F2;
      border-color: #C00000;
      box-shadow: 0 2px 8px rgba(192, 0, 0, 0.08);
    }
    .ref-var-name {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--forest);
      line-height: 1.25;
    }
    .ref-var-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .ref-var-badge {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #C00000;
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      vertical-align: middle;
    }
    .ref-var-price {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 800;
      color: var(--crimson);
      white-space: nowrap;
    }
    @media (max-width: 980px) {
      .review-layout { grid-template-columns: 1fr; }
      .review-sidebar { position: static; }
    }
    .meta-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px 18px;
      box-shadow: 0 6px 20px rgba(8, 35, 27, 0.05);
    }
    .meta-item label {
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .meta-item .val {
      font-size: 14px;
      font-weight: 700;
      color: var(--forest);
    }

    .approved-banner {
      display: none;
      background: #ECFDF5;
      border: 1.5px solid #22C55E;
      color: #14532D;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .approved-banner.is-visible { display: block; }

    .variant-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 10px 28px rgba(8, 35, 27, 0.07);
    }
    .variant-head {
      background: linear-gradient(90deg, #08231B 0%, #113B2F 100%);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .variant-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0.03em;
    }
    .variant-head .scope {
      font-size: 12px;
      color: #CBD5E1;
    }
    .variant-body {
      padding: 18px 20px 20px 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13.5px;
    }
    th {
      text-align: left;
      padding: 9px 12px;
      background: var(--forest);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    th.crimson-hdr { background: var(--crimson); }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #EAE2D7;
    }
    tr:nth-child(even) td { background: #FAF6F0; }
    tr.discount-row td { background: #FFF7ED !important; }
    tr.total-row td {
      background: var(--gold-bg) !important;
      border-top: 2px solid var(--crimson);
      border-bottom: 2px solid var(--crimson);
      font-weight: 800;
      font-size: 15px;
    }
    tr.total-row td.num {
      color: var(--crimson);
      font-size: 17px;
    }
    .disc-input-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .disc-input {
      width: 78px;
      padding: 5px 8px;
      border: 1.5px solid #EA580C;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: #9A3412;
      background: #fff;
      text-align: right;
    }
    .disc-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
    }
    .amt-input-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .amt-input {
      width: 118px;
      padding: 5px 8px;
      border: 1.5px solid #08231B;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: #08231B;
      background: #fff;
      text-align: right;
    }
    .amt-input:focus {
      outline: none;
      border-color: #EA580C;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.18);
    }
    .disc-saved-hint {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #15803D;
      margin-top: 2px;
    }
    .scope-strip {
      font-size: 12px;
      color: var(--muted);
      background: #FAF6F0;
      border: 1px solid #E8DFD3;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 640px) {
      .topbar { padding: 12px 14px; }
      .brand-title { font-size: 14px; }
      .container { margin: 14px auto 40px auto; padding: 0 10px; }
      .meta-card { padding: 14px; gap: 10px; grid-template-columns: 1fr 1fr; }
      .variant-head { padding: 12px 14px; }
      .variant-head h2 { font-size: 15px; }
      .variant-body { padding: 12px 12px 16px 12px; }
      table { font-size: 12.5px; }
      th, td { padding: 8px 8px; }
      .disc-input { width: 66px; font-size: 16px; padding: 6px; }
      .amt-input { width: 96px; font-size: 16px; padding: 6px; }
      .field input { font-size: 16px; min-height: 44px; }
      .approve-btn { min-height: 48px; font-size: 14.5px; }
    }
    .approval-box {
      background: var(--card);
      border: 2px solid var(--forest);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 12px 32px rgba(8, 35, 27, 0.1);
    }
    .approval-box h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
    }
    .approval-box p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .approval-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (max-width: 640px) {
      .approval-grid { grid-template-columns: 1fr; }
    }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #CBD5E1;
      border-radius: 7px;
      font-size: 13.5px;
    }
    .approve-btn {
      width: 100%;
      padding: 13px 18px;
      background: #15803D;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .approve-btn:hover { background: #166534; }
    .approve-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .err-card {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 14px;
      text-align: center;
      margin-top: 30px;
    }
    .loading-card {
      text-align: center;
      padding: 50px 20px;
      font-size: 15px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-tag">COOKSCAPE</div>
      <div>
        <div class="brand-title" id="hdrTitle">Commercial Quotation — Head Review</div>
        <div class="brand-sub" id="hdrSub">Edit variant discounts below and approve to unlock full client quotation link</div>
      </div>
    </div>
    <div id="statusPill" class="status-pill is-pending">⏳ Loading...</div>
  </header>

  <main class="container" id="mainWrap">
    <div class="loading-card">Loading quotation variants for review...</div>
  </main>

  <script>
    (function () {
      'use strict';

      var parts = window.location.pathname.split('/').filter(Boolean);
      var reviewToken = parts.length >= 2 && parts[0] === 'quote-review' ? parts[1] : '';
      var state = { review: null, variants: [] };

      function esc(s) {
        return String(s === undefined || s === null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function fmtINR(v) {
        var n = Math.round(Number(v) || 0);
        return (n < 0 ? '- ₹ ' : '₹ ') + Math.abs(n).toLocaleString('en-IN');
      }

      function recalcCommercial(comm, overrides) {
        var o = overrides || {};
        var woodwork = Math.round(Number(comm.woodworkSubtotal) || 0);
        var accessoriesEnabled = o.accessoriesEnabled !== undefined ? Boolean(o.accessoriesEnabled) : (comm.accessoriesEnabled !== false);
        var appliancesEnabled = o.appliancesEnabled !== undefined ? Boolean(o.appliancesEnabled) : (comm.appliancesEnabled !== false);
        var freightEnabled = o.freightEnabled !== undefined ? Boolean(o.freightEnabled) : (comm.freightEnabled !== false);
        var gstEnabled = o.gstEnabled !== undefined ? Boolean(o.gstEnabled) : (comm.gstEnabled !== false);

        var rawAcc = (o.additionalAccessories !== undefined && o.additionalAccessories !== null && o.additionalAccessories !== '')
          ? o.additionalAccessories
          : (comm.baseAdditionalAccessories !== undefined ? comm.baseAdditionalAccessories : comm.additionalAccessories);
        var rawApp = (o.appliances !== undefined && o.appliances !== null && o.appliances !== '')
          ? o.appliances
          : (comm.baseAppliances !== undefined ? comm.baseAppliances : comm.appliances);
        var baseAcc = Math.max(0, Math.round(Number(rawAcc) || 0));
        var baseApp = Math.max(0, Math.round(Number(rawApp) || 0));
        var acc = accessoriesEnabled ? baseAcc : 0;
        var app = appliancesEnabled ? baseApp : 0;

        var rawD = o.designPercent !== undefined ? o.designPercent : comm.designPercent;
        var dPct = (rawD !== undefined && rawD !== null && rawD !== '') ? Math.max(0, Math.min(100, Number(rawD) || 0)) : 9;
        var fPct = comm.freightPercent !== undefined ? Number(comm.freightPercent) : 2.5;
        var gstPct = comm.gstPercent !== undefined ? Number(comm.gstPercent) : 18;
        var designAmt = Math.round(woodwork * (dPct / 100));
        var freightAmt = freightEnabled ? Math.round(woodwork * (fPct / 100)) : 0;
        var originalBillableValue = Math.round(woodwork + designAmt + freightAmt);

        var discP = Math.max(0, Math.min(100, Number(o.discountPercent !== undefined ? o.discountPercent : comm.discountPercent) || 0));
        var adpP = Math.max(0, Math.min(100, Number(o.adpPercent !== undefined ? o.adpPercent : comm.adpPercent) || 0));
        var discAmt = Math.round(woodwork * (discP / 100));
        var woodworkAfterDiscount = Math.max(0, woodwork - discAmt);
        // Discount on Design Charge (replaces ADP): net value after % discount on Design Charges
        var adpAmt = Math.round(designAmt * (adpP / 100));
        var designAfterDiscount = Math.max(0, designAmt - adpAmt);
        var totalSavings = discAmt + adpAmt;
        var hasDiscount = totalSavings > 0;

        // Core Modular Proposal (Without Add-ons / Accessories & Appliances so they don't distort final discounted value)
        var coreNetBeforeTax = Math.max(0, Math.round(woodworkAfterDiscount + designAfterDiscount + freightAmt));
        var coreGstAmount = gstEnabled ? Math.round(coreNetBeforeTax * (gstPct / 100)) : 0;
        var coreGrandTotal = coreNetBeforeTax + coreGstAmount;

        var selectedAddons = Array.isArray(o.selectedAddons) ? o.selectedAddons : (Array.isArray(comm.selectedAddons) ? comm.selectedAddons : []);
        var appliancesList = Array.isArray(o.appliancesList) ? o.appliancesList : (Array.isArray(comm.appliancesList) ? comm.appliancesList : []);
        var addonsTotal = acc + app;
        var totalInvestmentWithAddons = coreGrandTotal + addonsTotal;

        var netBeforeTax = coreNetBeforeTax;
        var gstAmt = coreGstAmount;
        var grandTotal = coreGrandTotal;

        return Object.assign({}, comm, {
          woodworkSubtotal: woodwork,
          baseAdditionalAccessories: baseAcc,
          baseAppliances: baseApp,
          accessoriesEnabled: accessoriesEnabled,
          additionalAccessories: acc,
          appliancesEnabled: appliancesEnabled,
          appliances: app,
          selectedAddons: selectedAddons,
          appliancesList: appliancesList,
          addonsTotal: addonsTotal,
          totalInvestmentWithAddons: totalInvestmentWithAddons,
          coreNetBeforeTax: coreNetBeforeTax,
          coreGrandTotal: coreGrandTotal,
          designPercent: dPct,
          designAmount: designAmt,
          freightEnabled: freightEnabled,
          freightPercent: fPct,
          freightAmount: freightAmt,
          originalBillableValue: originalBillableValue,
          discountPercent: discP,
          discountAmount: discAmt,
          woodworkAfterDiscount: woodworkAfterDiscount,
          adpPercent: adpP,
          adpAmount: adpAmt,
          designAfterDiscount: designAfterDiscount,
          totalSavings: totalSavings,
          hasDiscount: hasDiscount,
          netBeforeTax: netBeforeTax,
          gstEnabled: gstEnabled,
          gstPercent: gstPct,
          gstAmount: gstAmt,
          grandTotal: grandTotal
        });
      }

      function updateVariantDom(idx) {
        var v = state.variants[idx];
        var card = document.querySelector('[data-var-idx="' + idx + '"]');
        if (!card || !v) return;
        var c = v.commercial;

        var accRow = card.querySelector('[data-row="accessories"]');
        if (accRow) accRow.style.opacity = c.accessoriesEnabled ? '' : '0.5';
        var accInputWrap = card.querySelector('[data-wrap="accInput"]');
        var accDis = card.querySelector('[data-f="accDisabled"]');
        var accInp = card.querySelector('[data-kind="accessories"]');
        if (accInputWrap) accInputWrap.style.display = c.accessoriesEnabled ? 'inline-flex' : 'none';
        if (accDis) accDis.style.display = c.accessoriesEnabled ? 'none' : 'inline';
        if (accInp && document.activeElement !== accInp) accInp.value = String(c.baseAdditionalAccessories || 0);

        var appRow = card.querySelector('[data-row="appliances"]');
        if (appRow) appRow.style.opacity = c.appliancesEnabled ? '' : '0.5';
        var appInputWrap = card.querySelector('[data-wrap="appInput"]');
        var appDis = card.querySelector('[data-f="appDisabled"]');
        var appInp = card.querySelector('[data-kind="appliances"]');
        if (appInputWrap) appInputWrap.style.display = c.appliancesEnabled ? 'inline-flex' : 'none';
        if (appDis) appDis.style.display = c.appliancesEnabled ? 'none' : 'inline';
        if (appInp && document.activeElement !== appInp) appInp.value = String(c.baseAppliances || 0);

        var dEl = card.querySelector('[data-f="designAmt"]');
        if (dEl) dEl.textContent = fmtINR(c.designAmount);

        var frtRow = card.querySelector('[data-row="freight"]');
        if (frtRow) frtRow.style.opacity = c.freightEnabled ? '' : '0.5';
        var frtEl = card.querySelector('[data-f="freightAmt"]');
        if (frtEl) frtEl.textContent = c.freightEnabled ? fmtINR(c.freightAmount) : 'Disabled';

        var origBillEl = card.querySelector('[data-f="origBillable"]');
        if (origBillEl) origBillEl.textContent = fmtINR(c.originalBillableValue);

        var discCell = card.querySelector('[data-f="discAmt"]');
        if (discCell) {
          discCell.innerHTML = '<span>' + fmtINR(c.woodworkAfterDiscount) + '</span>' +
            (c.discountAmount > 0 ? ('<span class="disc-saved-hint">Saved ' + fmtINR(c.discountAmount) + '</span>') : '');
        }
        var adpCell = card.querySelector('[data-f="adpAmt"]');
        if (adpCell) {
          adpCell.innerHTML = '<span>' + fmtINR(c.designAfterDiscount) + '</span>' +
            (c.adpAmount > 0 ? ('<span class="disc-saved-hint">Saved ' + fmtINR(c.adpAmount) + '</span>') : '');
        }
        card.querySelector('[data-f="netBeforeTax"]').textContent = fmtINR(c.netBeforeTax);

        var gstRow = card.querySelector('[data-row="gst"]');
        if (gstRow) gstRow.style.opacity = c.gstEnabled ? '' : '0.5';
        var gEl = card.querySelector('[data-f="gstAmt"]');
        if (gEl) gEl.textContent = c.gstEnabled ? fmtINR(c.gstAmount) : 'Disabled';

        var fLbl = card.querySelector('[data-f="finalLbl"]');
        if (fLbl) {
          fLbl.textContent = c.hasDiscount
            ? (c.gstEnabled ? 'FINAL DISCOUNTED VALUE (WITH GST)' : 'FINAL DISCOUNTED VALUE')
            : (c.gstEnabled ? 'FINAL TOTAL (WITH GST)' : 'FINAL TOTAL');
        }
        card.querySelector('[data-f="grandTotal"]').textContent = fmtINR(c.grandTotal);
        var sEl = card.querySelector('[data-f="totalSavings"]');
        if (sEl) sEl.textContent = fmtINR(c.totalSavings || 0);

        var addSubEl = card.querySelector('[data-f="addonsTotal"]');
        if (addSubEl) addSubEl.textContent = fmtINR(c.addonsTotal || 0);
        var addBadgeEl = card.querySelector('[data-f="addonsTotalBadge"]');
        if (addBadgeEl) addBadgeEl.textContent = '₹ ' + fmtINR(c.addonsTotal || 0);
        var totInvEl = card.querySelector('[data-f="totalInvestment"]');
        if (totInvEl) totInvEl.textContent = fmtINR(c.totalInvestmentWithAddons || 0);

        // Live-sync updated selected variant total into the All Variants side reference
        var sidePriceEl = document.querySelector('[data-side-tier="' + String(v.tierKey || '').replace(/"/g, '') + '"]');
        if (sidePriceEl) sidePriceEl.textContent = fmtINR(c.grandTotal);
      }

      function renderPage() {
        var r = state.review;
        var main = document.getElementById('mainWrap');
        var pill = document.getElementById('statusPill');
        document.getElementById('hdrTitle').textContent = (r.title || 'Commercial Quotation') + ' — Head Review';
        document.getElementById('hdrSub').textContent = 'Patron: ' + (r.clientName || '-') + ' • Ref: ' + (r.quoteCode || '-');

        var isApproved = r.approvalStatus === 'approved';
        pill.className = 'status-pill ' + (isApproved ? 'is-approved' : 'is-pending');
        pill.textContent = isApproved ? ('✅ Approved by ' + (r.approvedBy || 'Head')) : '⏳ Pending Head Approval';

        var html = '';
        if (isApproved) {
          html += '<div class="approved-banner is-visible">' +
            '<b>✅ Quotation Approved</b>' +
            (r.approvedBy ? (' by <b>' + esc(r.approvedBy) + '</b>') : '') +
            (r.approvedAt ? (' on ' + esc(new Date(r.approvedAt).toLocaleString('en-IN'))) : '') +
            '. The designer can now generate the full password-protected client link, PPTX &amp; PDF from Orbix Studio.' +
            (r.approvalRemarks ? ('<div style="margin-top:4px;">Remarks: <i>' + esc(r.approvalRemarks) + '</i></div>') : '') +
            '</div>';
        }

        html += '<div class="meta-card">' +
          '<div class="meta-item"><label>Patron Name</label><div class="val">' + esc(r.clientName || '-') + '</div></div>' +
          '<div class="meta-item"><label>Site Location</label><div class="val">' + esc(r.siteAddress || '-') + '</div></div>' +
          '<div class="meta-item"><label>Quote Ref</label><div class="val">' + esc(r.quoteCode || '-') + '</div></div>' +
          '<div class="meta-item"><label>Designer / BH</label><div class="val">' + esc((r.designer && r.designer.name) || '-') + '</div></div>' +
          '</div>';

        html += '<div class="review-layout"><div class="review-main">';

        state.variants.forEach(function (v, idx) {
          var c = v.commercial || {};
          var rooms = v.roomsSummary || [];
          html += '<section class="variant-card" data-var-idx="' + idx + '">' +
            '<div class="variant-head">' +
            '  <h2>' + esc(v.tierTitle || v.tierKey) + ' — QUOTATION</h2>' +
            '  <div class="scope">Scope: ' + esc(v.roomScopeLabel || 'All Rooms') + '</div>' +
            '</div>' +
            '<div class="variant-body">';

          if (rooms.length) {
            html += '<table><thead><tr><th>Room-Wise Breakdown</th><th class="num">Units</th><th class="num">Amount</th></tr></thead><tbody>';
            rooms.forEach(function (rm) {
              html += '<tr><td><b>' + esc(rm.name || 'Room') + '</b></td><td class="num">' + (rm.itemCount || 0) + '</td><td class="num"><b>' + fmtINR(rm.roomSubtotal) + '</b></td></tr>';
            });
            html += '</tbody></table>';
          }

          html += '<table><thead><tr><th class="crimson-hdr">Cost Estimation Summary &amp; Editable Controls</th><th class="crimson-hdr num">Amount</th></tr></thead><tbody>' +
            '<tr><td><b>Modular Woodwork Subtotal</b></td><td class="num"><b>' + fmtINR(c.woodworkSubtotal) + '</b></td></tr>' +
            '<tr class="discount-row">' +
            '  <td><div class="disc-input-wrap"><b>Design Charges (%):</b> ' +
            '    <input type="number" step="0.5" min="0" max="100" class="disc-input" data-idx="' + idx + '" data-kind="design" value="' + esc(c.designPercent !== undefined ? c.designPercent : 9) + '">' +
            '    <span>%</span></div></td>' +
            '  <td class="num" style="font-weight:700;" data-f="designAmt">' + fmtINR(c.designAmount) + '</td>' +
            '</tr>' +
            '<tr data-row="freight" style="' + (c.freightEnabled ? '' : 'opacity:0.5;') + '">' +
            '  <td><label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;"><input type="checkbox" class="rev-toggle" data-idx="' + idx + '" data-toggle="freightEnabled"' + (c.freightEnabled ? ' checked' : '') + '> <b>Freight Charges (' + esc(c.freightPercent) + '%)</b> <span style="font-size:11px;color:#64748B;">(Enable / Disable)</span></label></td>' +
            '  <td class="num" data-f="freightAmt">' + (c.freightEnabled ? fmtINR(c.freightAmount) : 'Disabled') + '</td>' +
            '</tr>' +
            '<tr style="background:#F8FAFC;"><td><b>Original Billable Value</b></td><td class="num"><b data-f="origBillable">' + fmtINR(c.originalBillableValue) + '</b></td></tr>' +
            '<tr class="discount-row">' +
            '  <td><div class="disc-input-wrap"><b>Discount on Wood Work (%):</b> ' +
            '    <input type="number" step="0.5" min="0" max="100" class="disc-input" data-idx="' + idx + '" data-kind="discount" value="' + esc(c.discountPercent || 0) + '">' +
            '    <span>%</span></div></td>' +
            '  <td class="num" style="color:#08231B;font-weight:700;" data-f="discAmt"><span>' + fmtINR(c.woodworkAfterDiscount) + '</span>' + (c.discountAmount > 0 ? ('<span class="disc-saved-hint">Saved ' + fmtINR(c.discountAmount) + '</span>') : '') + '</td>' +
            '</tr>' +
            '<tr class="discount-row">' +
            '  <td><div class="disc-input-wrap"><b>Discount on Design Charge (%):</b> ' +
            '    <input type="number" step="0.5" min="0" max="100" class="disc-input" data-idx="' + idx + '" data-kind="adp" value="' + esc(c.adpPercent || 0) + '">' +
            '    <span>%</span></div></td>' +
            '  <td class="num" style="color:#08231B;font-weight:700;" data-f="adpAmt"><span>' + fmtINR(c.designAfterDiscount) + '</span>' + (c.adpAmount > 0 ? ('<span class="disc-saved-hint">Saved ' + fmtINR(c.adpAmount) + '</span>') : '') + '</td>' +
            '</tr>' +
            '<tr><td><b>Grand Total (Without GST)</b></td><td class="num"><b data-f="netBeforeTax">' + fmtINR(c.netBeforeTax) + '</b></td></tr>' +
            '<tr data-row="gst" style="' + (c.gstEnabled ? '' : 'opacity:0.5;') + '">' +
            '  <td><label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;"><input type="checkbox" class="rev-toggle" data-idx="' + idx + '" data-toggle="gstEnabled"' + (c.gstEnabled ? ' checked' : '') + '> <b>GST (' + esc(c.gstPercent) + '%)</b> <span style="font-size:11px;color:#64748B;">(Enable / Disable)</span></label></td>' +
            '  <td class="num" data-f="gstAmt">' + (c.gstEnabled ? fmtINR(c.gstAmount) : 'Disabled') + '</td>' +
            '</tr>' +
            '<tr class="total-row"><td data-f="finalLbl">' + (c.hasDiscount ? (c.gstEnabled ? 'FINAL DISCOUNTED VALUE (WITH GST)' : 'FINAL DISCOUNTED VALUE') : (c.gstEnabled ? 'FINAL TOTAL (WITH GST)' : 'FINAL TOTAL')) + '</td><td class="num" data-f="grandTotal">' + fmtINR(c.grandTotal) + '</td></tr>' +
            '<tr style="background:#ECFDF5;"><td style="color:#166534;font-weight:800;">YOUR SAVINGS</td><td class="num" style="color:#166534;font-weight:800;" data-f="totalSavings">' + fmtINR(c.totalSavings || 0) + '</td></tr>' +
            '</tbody></table>' +

            // ── ADD-ONS, ACCESSORIES & APPLIANCES (DOWN AFTER YOUR SAVINGS) ──
            '<div style="margin-top:14px;border:1.5px solid #08231B;border-radius:8px;overflow:hidden;background:#fff;">' +
            '  <div style="background:#08231B;color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12.5px;">' +
            '    <span>ADD-ONS, ACCESSORIES &amp; APPLIANCES (SELECTED ITEMS)</span>' +
            '    <span data-f="addonsTotalBadge" style="color:#FEF9C3;font-family:monospace;font-size:13px;">₹ ' + fmtINR(c.addonsTotal || 0) + '</span>' +
            '  </div>' +
            '  <table><tbody>' +
            '    <tr data-row="accessories" style="' + (c.accessoriesEnabled ? '' : 'opacity:0.5;') + '">' +
            '      <td><label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;"><input type="checkbox" class="rev-toggle" data-idx="' + idx + '" data-toggle="accessoriesEnabled"' + (c.accessoriesEnabled ? ' checked' : '') + '> <b>Additional Accessories</b> <span style="font-size:11px;color:#64748B;">(Enable / Disable)</span></label></td>' +
            '      <td class="num">' +
            '        <span class="amt-input-wrap" data-wrap="accInput" style="display:' + (c.accessoriesEnabled ? 'inline-flex' : 'none') + ';">' +
            '          <span>₹</span><input type="number" step="100" min="0" class="amt-input" data-idx="' + idx + '" data-kind="accessories" value="' + esc(c.baseAdditionalAccessories || 0) + '" placeholder="0">' +
            '        </span>' +
            '        <span data-f="accDisabled" style="display:' + (c.accessoriesEnabled ? 'none' : 'inline') + ';color:#64748B;">Disabled</span>' +
            '      </td>' +
            '    </tr>' +
            (c.selectedAddons && c.selectedAddons.length ? ('<tr><td colspan="2" style="background:#FAF6F0;padding:6px 12px;font-size:11.5px;color:#334155;">' +
              c.selectedAddons.map(function(it){ return '<div style="margin:2px 0;">• <b>' + esc(it.name) + '</b> (Qty: ' + (it.qty||1) + ') &mdash; ₹' + Number(it.amount || ((it.qty||1)*(it.rate||0))).toLocaleString('en-IN') + '</div>'; }).join('') +
              '</td></tr>') : '') +
            '    <tr data-row="appliances" style="' + (c.appliancesEnabled ? '' : 'opacity:0.5;') + '">' +
            '      <td><label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;"><input type="checkbox" class="rev-toggle" data-idx="' + idx + '" data-toggle="appliancesEnabled"' + (c.appliancesEnabled ? ' checked' : '') + '> <b>Appliances</b> <span style="font-size:11px;color:#64748B;">(Enable / Disable)</span></label></td>' +
            '      <td class="num">' +
            '        <span class="amt-input-wrap" data-wrap="appInput" style="display:' + (c.appliancesEnabled ? 'inline-flex' : 'none') + ';">' +
            '          <span>₹</span><input type="number" step="100" min="0" class="amt-input" data-idx="' + idx + '" data-kind="appliances" value="' + esc(c.baseAppliances || 0) + '" placeholder="0">' +
            '        </span>' +
            '        <span data-f="appDisabled" style="display:' + (c.appliancesEnabled ? 'none' : 'inline') + ';color:#64748B;">Disabled</span>' +
            '      </td>' +
            '    </tr>' +
            (c.appliancesList && c.appliancesList.length ? ('<tr><td colspan="2" style="background:#FAF6F0;padding:6px 12px;font-size:11.5px;color:#334155;">' +
              c.appliancesList.map(function(ap){ return '<div style="margin:2px 0;">• <b>' + esc(ap.name) + '</b> &mdash; ₹' + Number(ap.amount || ((ap.rate||0)*(ap.qty||1))).toLocaleString('en-IN') + '</div>'; }).join('') +
              '</td></tr>') : '') +
            '    <tr style="background:#F8FAFC;font-weight:700;">' +
            '      <td>Add-ons &amp; Accessories Subtotal</td>' +
            '      <td class="num" data-f="addonsTotal">' + fmtINR(c.addonsTotal || 0) + '</td>' +
            '    </tr>' +
            '    <tr style="background:#ECFDF5;font-weight:800;border-top:1.5px solid #16A34A;">' +
            '      <td style="color:#08231B;font-size:12.5px;">TOTAL PROJECT INVESTMENT (PROPOSAL + ADD-ONS)</td>' +
            '      <td class="num" style="color:#166534;font-size:13.5px;" data-f="totalInvestment">' + fmtINR(c.totalInvestmentWithAddons || 0) + '</td>' +
            '    </tr>' +
            '  </tbody></table>' +
            '</div>' + +
            '<div class="scope-strip">' +
            'Loading/Unloading: <b>' + esc(c.loadingUnloadingStatus || 'Additional') + '</b> &bull; ' +
            'Floor Mat: <b>' + esc(c.floorMatStatus || 'Not Included') + '</b> &bull; ' +
            'Civil: <b>' + esc(c.civilWorksStatus || 'As per actuals') + '</b> &bull; ' +
            'Elec/Plumb: <b>' + esc(c.electricalPlumbingStatus || 'Additional') + '</b> &bull; ' +
            'False Ceiling: <b>' + esc(c.falseCeilingStatus || 'Not Included') + '</b>' +
            '</div>' +
            '</div></section>';
        });

        html += '<section class="approval-box">' +
          '<h3>' + (isApproved ? 'Update Approved Discounts / Re-Approve' : 'Head Approval Confirmation') + '</h3>' +
          '<p>Verify the variant totals &amp; discounts above, then click Approve to unlock client link generation, PPTX &amp; PDF downloads inside Orbix Studio.</p>' +
          '<div class="approval-grid">' +
          '  <div class="field"><label for="headNameInput">Approved By (Head Name)</label><input id="headNameInput" type="text" value="' + esc(r.approvedBy || 'Business Head') + '" placeholder="e.g. Sangathamizh"></div>' +
          '  <div class="field"><label for="headRemarksInput">Approval Remarks (Optional)</label><input id="headRemarksInput" type="text" value="' + esc(r.approvalRemarks || '') + '" placeholder="e.g. Approved 5% discount on woodwork"></div>' +
          '</div>' +
          '<div id="approveErr" style="display:none;color:#B91C1C;font-size:13px;margin-bottom:10px;font-weight:600;"></div>' +
          '<button type="button" class="approve-btn" id="approveBtn">' + (isApproved ? '✅ Save Updated Discounts &amp; Re-Approve' : '✅ Approve Quotation &amp; Unlock Client Link') + '</button>' +
          '</section>';

        html += '</div>'; // end .review-main

        // Side Section: All Master Template Variant Types & Pricing Reference
        var allVarRef = Array.isArray(r.allVariantsPricing) && r.allVariantsPricing.length
          ? r.allVariantsPricing
          : state.variants.map(function (v) {
              return { tierKey: v.tierKey, tierTitle: v.tierTitle || v.tierKey, unitCount: 0, grandTotal: v.grandTotal || 0, selected: true };
            });
        var selectedKeySet = {};
        state.variants.forEach(function (v) { selectedKeySet[String(v.tierKey || '').toLowerCase()] = v; });

        html += '<aside class="review-sidebar">' +
          '<div class="review-sidebar-head">' +
          '  <h3>All Variant Types &amp; Pricing</h3>' +
          '  <p>Reference pricing across all Master Template variants</p>' +
          '</div>' +
          '<div class="review-sidebar-list">';
        allVarRef.forEach(function (av) {
          var liveMatch = selectedKeySet[String(av.tierKey || '').toLowerCase()];
          var isSel = Boolean(liveMatch || av.selected);
          var displayPrice = liveMatch && liveMatch.commercial ? liveMatch.commercial.grandTotal : av.grandTotal;
          html += '<div class="ref-var-item' + (isSel ? ' is-selected' : '') + '">' +
            '<div>' +
            '  <div class="ref-var-name">' + esc(av.tierTitle || av.tierKey) + (isSel ? '<span class="ref-var-badge">Selected</span>' : '') + '</div>' +
            '  <div class="ref-var-sub">' + (av.unitCount ? (esc(av.unitCount) + ' units + quote') : 'Master Variant') + '</div>' +
            '</div>' +
            '<div class="ref-var-price" data-side-tier="' + esc(av.tierKey || '') + '">' + fmtINR(displayPrice || 0) + '</div>' +
            '</div>';
        });
        html += '</div></aside></div>'; // end .review-layout

        main.innerHTML = html;

        function readCardOverrides(card) {
          var getChk = function (name) {
            var el = card.querySelector('[data-toggle="' + name + '"]');
            return el ? el.checked : true;
          };
          var accInput = card.querySelector('[data-kind="accessories"]');
          var appInput = card.querySelector('[data-kind="appliances"]');
          return {
            designPercent: card.querySelector('[data-kind="design"]').value,
            discountPercent: card.querySelector('[data-kind="discount"]').value,
            adpPercent: card.querySelector('[data-kind="adp"]').value,
            additionalAccessories: accInput ? accInput.value : 0,
            appliances: appInput ? appInput.value : 0,
            accessoriesEnabled: getChk('accessoriesEnabled'),
            appliancesEnabled: getChk('appliancesEnabled'),
            freightEnabled: getChk('freightEnabled'),
            gstEnabled: getChk('gstEnabled')
          };
        }

        main.querySelectorAll('.disc-input, .amt-input, .rev-toggle').forEach(function (el) {
          var ev = el.type === 'checkbox' ? 'change' : 'input';
          el.addEventListener(ev, function () {
            var i = Number(this.getAttribute('data-idx'));
            var card = main.querySelector('[data-var-idx="' + i + '"]');
            state.variants[i].commercial = recalcCommercial(state.variants[i].commercial, readCardOverrides(card));
            state.variants[i].grandTotal = state.variants[i].commercial.grandTotal;
            updateVariantDom(i);
          });
        });

        document.getElementById('approveBtn').addEventListener('click', async function () {
          var btn = this;
          var errEl = document.getElementById('approveErr');
          errEl.style.display = 'none';
          btn.disabled = true;
          btn.textContent = '⏳ Saving & Approving...';
          try {
            var variantDiscounts = state.variants.map(function (v) {
              return {
                tierKey: v.tierKey,
                designPercent: Number(v.commercial.designPercent),
                discountPercent: Number(v.commercial.discountPercent) || 0,
                adpPercent: Number(v.commercial.adpPercent) || 0,
                additionalAccessories: Number(v.commercial.baseAdditionalAccessories) || 0,
                appliances: Number(v.commercial.baseAppliances) || 0,
                accessoriesEnabled: v.commercial.accessoriesEnabled !== false,
                appliancesEnabled: v.commercial.appliancesEnabled !== false,
                freightEnabled: v.commercial.freightEnabled !== false,
                gstEnabled: v.commercial.gstEnabled !== false
              };
            });
            var res = await fetch('/api/quote-review/' + encodeURIComponent(reviewToken) + '/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                approvedBy: document.getElementById('headNameInput').value.trim() || 'Business Head',
                approvalRemarks: document.getElementById('headRemarksInput').value.trim(),
                variantDiscounts: variantDiscounts
              })
            });
            var data = await res.json();
            if (!res.ok || !data.success) {
              throw new Error(data.error || 'Approval failed');
            }
            state.review = data.review;
            state.variants = (data.review.variants || []).map(function (v) {
              return Object.assign({}, v, { commercial: recalcCommercial(v.commercial || {}) });
            });
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (err) {
            errEl.textContent = err.message || 'Unable to approve quotation.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '✅ Approve Quotation & Unlock Client Link';
          }
        });
      }

      async function loadReview() {
        var main = document.getElementById('mainWrap');
        if (!reviewToken) {
          main.innerHTML = '<div class="err-card">Invalid review link. Missing token.</div>';
          return;
        }
        try {
          var res = await fetch('/api/quote-review/' + encodeURIComponent(reviewToken), { cache: 'no-store' });
          var data = await res.json();
          if (!res.ok || !data.success || !data.review) {
            throw new Error(data.error || 'Review link not found or revoked.');
          }
          state.review = data.review;
          state.variants = (data.review.variants || []).map(function (v) {
            var c = v.commercial || {};
            return Object.assign({}, v, {
              commercial: recalcCommercial(c)
            });
          });
          renderPage();
        } catch (err) {
          document.getElementById('statusPill').textContent = 'Unavailable';
          main.innerHTML = '<div class="err-card">' + esc(err.message || 'Unable to load review link.') + '</div>';
        }
      }

      loadReview();
    })();
  </script>
</body>
</html>
